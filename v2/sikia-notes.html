<title>Sikia Law — Notes</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  :root {
    --bg: #ffffff; --bg-muted: #fafafa;
    --surface: #ffffff; --surface-2: #f4f4f5; --surface-3: #e8e8ea;
    --line: #dcdcdf; --line-2: #ececee;
    --text: #0f0f10; --text-2: #525255; --text-3: #8a8a8f;
    --accent: #0f0f10; --accent-fg: #ffffff;
    --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  @font-face {
    font-family: "FA";
    src: url("fonts/fontawesome-regular.otf") format("opentype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  .fa {
    font-family: "FA"; font-style: normal; font-weight: 400;
    display: inline-block; text-rendering: auto;
    -webkit-font-smoothing: antialiased; line-height: 1;
  }
  .fa-search::before     { content: "\f002"; }
  .fa-home::before       { content: "\f015"; }
  .fa-file-lines::before { content: "\f15c"; }
  .fa-book::before       { content: "\f02d"; }
  .fa-bookmark::before   { content: "\f02e"; }
  .fa-chevron-right::before { content: "\f054"; }
  .fa-arrow-up-right::before { content: "\f08e"; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    color: var(--text); background: var(--bg-muted);
    line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  h1, h2, h3, h4 { font-weight: 600; letter-spacing: -0.015em; color: var(--text); margin: 0; }
  p { margin: 0; color: var(--text-2); }
  a { color: inherit; }

  /* Shell — matches shell_template.html */
  .dash-shell { display: grid; grid-template-columns: 272px 1fr; min-height: 100vh; }
  .sidebar {
    background: var(--surface); border-right: 1px solid var(--line-2);
    padding: 26px 18px 16px;
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
  }
  .sidebar-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); padding: 4px 10px; margin-bottom: 36px; }
  .logo-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--text); color: var(--accent-fg); display: flex; align-items: center; justify-content: center; font-size: 0.92rem; font-weight: 700; }
  .logo-word { font-weight: 600; font-size: 1.05rem; letter-spacing: -0.01em; }

  .side-nav { display: flex; flex-direction: column; gap: 4px; }
  .side-nav-item {
    display: flex; align-items: center; gap: 14px;
    padding: 11px 12px; border-radius: 10px;
    font-size: 0.96rem; font-weight: 500;
    color: var(--text-2); text-decoration: none; cursor: pointer; position: relative;
    transition: background 0.18s ease, color 0.18s ease;
  }
  .side-nav-item .nav-ico {
    width: 22px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 1.05rem; color: var(--text-3);
    transition: color 0.18s ease;
  }
  .side-nav-item:hover { background: var(--surface-2); color: var(--text); }
  .side-nav-item:hover .nav-ico { color: var(--text); }
  .side-nav-item.active { background: var(--surface-2); color: var(--text); font-weight: 600; }
  .side-nav-item.active .nav-ico { color: var(--text); }
  .nav-count {
    margin-left: auto; font-size: 0.74rem; font-weight: 500;
    padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--text-2); min-width: 28px; text-align: center;
  }
  .side-nav-item.active .nav-count { background: var(--surface); color: var(--text); }

  .sidebar-foot {
    margin-top: auto; padding: 12px 10px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer; border-radius: 10px; text-decoration: none;
    transition: background 0.18s ease;
  }
  .sidebar-foot:hover { background: var(--surface-2); }
  .avatar-md {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, var(--surface-3), var(--surface-2));
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.84rem; font-weight: 600; color: var(--text-2); flex-shrink: 0;
  }
  .user-block { min-width: 0; }
  .user-block .name { font-size: 0.96rem; font-weight: 600; color: var(--text); line-height: 1.2; }
  .user-block .meta { font-size: 0.78rem; color: var(--text-3); margin-top: 2px; }

  .main { padding: 28px 40px 80px; min-width: 0; }

  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .search-input {
    flex: 1; max-width: 480px;
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .search-input:focus-within { border-color: var(--text-2); box-shadow: 0 0 0 4px rgba(15, 15, 16, 0.05); }
  .search-input input { flex: 1; border: none; outline: none; background: transparent; font-family: inherit; font-size: 0.9rem; color: var(--text); }
  .search-input input::placeholder { color: var(--text-3); }
  .search-input .fa { color: var(--text-3); font-size: 0.95rem; }
  .topbar-spacer { flex: 1; }
  .kbd { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line-2); color: var(--text-3); font-family: ui-monospace, monospace; }

  .breadcrumb {
    font-size: 0.82rem; color: var(--text-3);
    display: flex; gap: 6px; align-items: center; margin-bottom: 14px;
  }
  .breadcrumb a { text-decoration: none; }
  .breadcrumb a:hover { color: var(--text); }

  .page-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 28px; gap: 24px; flex-wrap: wrap;
  }
  .page-head h1 { font-size: 2.1rem; letter-spacing: -0.02em; }
  .page-head p { margin-top: 8px; max-width: 60ch; }
  .page-head-meta { display: flex; align-items: center; gap: 16px; color: var(--text-3); font-size: 0.85rem; }

  /* Notes-specific styles */
  .year-tabs {
    display: flex; gap: 6px;
    margin-bottom: 28px;
    border: 1px solid var(--line-2); background: var(--surface);
    padding: 6px; border-radius: 12px; width: fit-content;
  }
  .year-tab {
    padding: 9px 22px; border-radius: 8px;
    border: none; background: transparent;
    font-family: inherit; font-size: 0.92rem; font-weight: 500;
    color: var(--text-2); cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }
  .year-tab:hover { background: var(--surface-2); color: var(--text); }
  .year-tab:active { transform: scale(0.96); }
  .year-tab.active { background: var(--text); color: var(--accent-fg); font-weight: 600; }

  .year-pane { animation: paneFade 0.35s var(--ease-out); }
  @keyframes paneFade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .semester-block { margin-bottom: 48px; }
  .semester-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  .semester-head h2 { font-size: 0.84rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-2); }
  .semester-head .sem-count { font-size: 0.78rem; color: var(--text-3); }
  .semester-head::after { content: ""; flex: 1; height: 1px; background: var(--line-2); margin-left: 6px; }

  .course-list { display: flex; flex-direction: column; gap: 10px; }
  .course-section {
    background: var(--surface); border: 1px solid var(--line-2);
    border-radius: 12px; overflow: hidden;
    transition: border-color 0.15s ease;
  }
  .course-section:hover, .course-section.open { border-color: var(--line); }

  .course-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; cursor: pointer; user-select: none;
    transition: background 0.15s ease;
  }
  .course-head:hover { background: var(--surface-2); }
  .course-section.open .course-head { background: var(--surface-2); border-bottom: 1px solid var(--line-2); }

  .course-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .folder-icon {
    width: 30px; height: 24px; flex-shrink: 0;
    border: 1.5px solid var(--text-2); border-radius: 4px;
    position: relative; background: var(--surface);
    transition: transform 0.2s var(--ease-out);
  }
  .folder-icon::before {
    content: ""; position: absolute;
    top: -5px; left: 2px; width: 11px; height: 4px;
    border: 1.5px solid var(--text-2); border-bottom: none;
    border-radius: 2px 2px 0 0; background: var(--surface);
  }
  .course-section.open .folder-icon { transform: translateY(-1px) rotate(-3deg); }
  .course-meta-block { min-width: 0; }
  .course-name {
    font-size: 0.96rem; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .course-code {
    font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-3); margin-bottom: 3px; font-weight: 500;
  }
  .course-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .course-count {
    font-size: 0.76rem; color: var(--text-3);
    padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px;
    white-space: nowrap;
  }
  .course-count.empty { border-style: dashed; }
  .chevron {
    width: 16px; height: 16px; color: var(--text-3);
    transition: transform 0.3s var(--ease-out), color 0.2s ease;
    display: flex; align-items: center; justify-content: center; font-size: 0.8rem;
  }
  .course-section.open .chevron { transform: rotate(90deg); color: var(--text); }

  .course-notes { overflow: hidden; max-height: 0; transition: max-height 0.45s var(--ease-out); }
  .course-section.open .course-notes { max-height: 3000px; }
  .course-notes-inner {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px; padding: 16px 18px 18px;
  }

  .note-card {
    background: var(--bg-muted);
    border: 1px solid transparent;
    border-radius: 10px; padding: 14px 16px;
    text-decoration: none; color: inherit; cursor: pointer;
    display: flex; flex-direction: column; gap: 8px; min-height: 96px;
    transition: transform 0.18s var(--ease-out), border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
  }
  .note-card:hover {
    transform: translateY(-2px);
    border-color: var(--line);
    background: var(--surface);
    box-shadow: 0 4px 14px -10px rgba(0,0,0,0.08);
  }
  .note-type { font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
  .note-type-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
  .note-title { font-size: 0.9rem; font-weight: 500; line-height: 1.35; color: var(--text); }
  .note-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; font-size: 0.72rem; color: var(--text-3); }
  .note-open { display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; color: var(--text-3); transition: color 0.15s ease, gap 0.15s ease; }
  .note-card:hover .note-open { color: var(--text); gap: 7px; }

  .empty-row { padding: 20px 18px; color: var(--text-3); font-size: 0.85rem; border-top: 1px dashed var(--line-2); text-align: center; }
  .course-section.no-notes .course-head { cursor: default; }
  .course-section.no-notes:hover .course-head { background: transparent; }
  .course-section.no-notes:hover { border-color: var(--line-2); }
  .course-section.no-notes .chevron { opacity: 0; }

  @media (max-width: 900px) {
    .dash-shell { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .main { padding: 20px; }
    .course-notes-inner { grid-template-columns: 1fr; }
    .page-head h1 { font-size: 1.6rem; }
    .year-tabs { width: 100%; overflow-x: auto; flex-wrap: nowrap; }
    .year-tab { flex: 1 0 auto; padding: 9px 14px; }
  }
</style>
</head>

      "assigned_to": "LAW 4216 Gender and the Law (Year 4 Sem 2)",
      "reason": "Same file appears in YR 4 SEM 2 folder as well. Spreadsheet places Gender CW under both LAW 4216 and Jurisprudence II — kept the LAW 4216 link as primary."
    }
  ],
  "_unmapped_pdfs": {
    "_note": "These 8 PDFs are duplicate copies of files already mapped under another path (same filename in another folder, or explicit 'copy' suffix). They aren't lost — the canonical file is referenced. Listed here for completeness.",
    "duplicates": [
      {

  const NOTES_PATH_PREFIX = "../Notes/";
  const DEFAULT_YEAR = 2;

  const tabsEl = document.getElementById('year-tabs');
  const contentEl = document.getElementById('year-content');
  const yearStatsEl = document.getElementById('year-stats');

  function buildTabs() {
    CURRICULUM.years.forEach(y => {
      const btn = document.createElement('button');
      btn.className = 'year-tab' + (y.year === DEFAULT_YEAR ? ' active' : '');
      btn.textContent = y.label;
      btn.dataset.year = y.year;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.year-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderYear(y.year);
      });
      tabsEl.appendChild(btn);
    });
  }

  function noteHref(file) {
    return NOTES_PATH_PREFIX + file.split('/').map(encodeURIComponent).join('/');
  }

  function renderYear(yearNum) {
    const year = CURRICULUM.years.find(y => y.year === yearNum);
    if (!year) return;
    let totalCourses = 0, totalNotes = 0;
    year.semesters.forEach(s => {
      totalCourses += s.courses.length;
      s.courses.forEach(c => { totalNotes += c.notes.length; });
    });
    yearStatsEl.textContent = `${totalCourses} course units · ${totalNotes} notes`;

    const pane = document.createElement('div');
    pane.className = 'year-pane';
    year.semesters.forEach(sem => {
      const block = document.createElement('div');
      block.className = 'semester-block';
      const head = document.createElement('div');
      head.className = 'semester-head';
      const noteCount = sem.courses.reduce((n, c) => n + c.notes.length, 0);
      head.innerHTML = `<h2>${sem.label}</h2><span class="sem-count">${sem.courses.length} courses · ${noteCount} notes</span>`;
      block.appendChild(head);

      const list = document.createElement('div');
      list.className = 'course-list';
      sem.courses.forEach((course, idx) => {
        const isEmpty = course.notes.length === 0;
        const sec = document.createElement('div');
        sec.className = 'course-section' + (isEmpty ? ' no-notes' : '');
        if (!isEmpty && sem.semester === 1 && list.querySelectorAll('.course-section.open').length === 0 && idx < 2) {
          sec.classList.add('open');
        }
        const headEl = document.createElement('div');
        headEl.className = 'course-head';
        const codeLabel = course.code ? course.code : 'No code';
        headEl.innerHTML = `
          <div class="course-left">
            <div class="folder-icon"></div>
            <div class="course-meta-block">
              <div class="course-code">${codeLabel}</div>
              <div class="course-name">${course.title}</div>
            </div>
          </div>
          <div class="course-right">
            <span class="course-count${isEmpty ? ' empty' : ''}">${isEmpty ? 'No notes yet' : course.notes.length + ' note' + (course.notes.length === 1 ? '' : 's')}</span>
            <div class="chevron"><i class="fa fa-chevron-right"></i></div>
          </div>
        `;
        sec.appendChild(headEl);
        const notesEl = document.createElement('div');
        notesEl.className = 'course-notes';
        const inner = document.createElement('div');
        inner.className = 'course-notes-inner';
        if (isEmpty) {
          const empty = document.createElement('div');
          empty.className = 'empty-row';
          empty.textContent = 'No notes attached for this course yet.';
          notesEl.appendChild(empty);
        } else {
          course.notes.forEach(note => {
            const card = document.createElement('a');
            card.className = 'note-card';
            // Route through the v2 document reader. Falls back to opening the raw PDF if html_file is missing.
            if (note.html_file) {
              card.href = `sikia-document.html?file=${encodeURIComponent(note.html_file)}`;
            } else {
              card.href = noteHref(note.file);
              card.target = '_blank';
              card.rel = 'noopener';
            }
            card.innerHTML = `
              <div class="note-type"><span class="note-type-dot"></span>${note.html_file ? 'Note' : 'PDF'}</div>
              <div class="note-title">${note.title}</div>
              <div class="note-foot">
                <span>Lecture note</span>
                <span class="note-open">Open <i class="fa fa-arrow-up-right"></i></span>
              </div>
            `;
            inner.appendChild(card);
          });
          notesEl.appendChild(inner);
        }
        sec.appendChild(notesEl);
        if (!isEmpty) headEl.addEventListener('click', () => sec.classList.toggle('open'));
        list.appendChild(sec);
      });
      block.appendChild(list);
      pane.appendChild(block);
    });
    contentEl.replaceChildren(pane);
  }

  const searchInput = document.getElementById('search');
  searchInput.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    document.querySelectorAll('.course-section').forEach(sec => {
      const text = sec.textContent.toLowerCase();
      sec.style.display = (!q || text.includes(q)) ? '' : 'none';
      if (q && text.includes(q)) sec.classList.add('open');
    });
  });
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); searchInput.focus(); }
  });

  buildTabs();
  renderYear(DEFAULT_YEAR);
</script>
